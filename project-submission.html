<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Submission Form</title>
</head>
<body>
  <div class="form-container">
    <h2>Project Submission Form</h2>
    <form id="projectForm">
      <label for="name">Project Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your project name" required />

      <label for="description">Description</label>
      <textarea id="description" name="description" placeholder="Brief project summary" required></textarea>

      <label for="team">Team Members</label>
      <input type="text" id="team" name="team" placeholder="e.g. Alice, Bob, Carol" />

      <label for="category">Category</label>
      <select id="category" name="category" required>
        <option value="">Select category</option>
        <option value="research">Research</option>
        <option value="design">Design</option>
        <option value="development">Development</option>
        <option value="marketing">Marketing</option>
      </select>

      <label for="file">Upload File (optional)</label>
      <input type="file" id="file" name="file" accept=".pdf,.docx,.zip" />

      <button type="submit">Submit Project</button>
    </form>
  </div>
</body>
</html>
